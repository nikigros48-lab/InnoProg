<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
</head>
<body>
    {% for product, quantity in cart.items %}
        {% if discount %}
            <h3>{{ product.title }} - {{ product.effective_price }} * {{ quantity.0 }} = {{ quantity.1 }}</h3>
        {% else %}
            <h3>{{ product.title }} - {{ product.price }} * {{ quantity.0 }} = {{ quantity.1 }}</h3>
        {% endif %}
    {% endfor %}
</body>
</html>
