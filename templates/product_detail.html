<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ product.title }}</title>
</head>
<body>
    <script>
        window.addEventListener('load', function() {
            const toCartBtn = document.getElementById("add-to-cart");
            const increase = document.getElementById("increase");
            const decrease = document.getElementById("decrease");
            const counter = document.getElementById("counter");

            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }
            const csrftoken = getCookie('csrftoken');

            const productId = {{ product.id }};

            increase.onclick = function (event) {
                let value = parseInt(counter.innerHTML);
                if (isNaN(value)) value = 0;
                if (value < {{ product.stock }}) value++;
                counter.innerHTML = value.toString();
            }

            decrease.onclick = function (event) {
                let value = parseInt(counter.innerHTML);
                if (isNaN(value)) value = 0;
                if (value > 0) value--;
                counter.innerHTML = value.toString();
            }

            function setButtonState(inCart) {
                if (inCart) {
                    toCartBtn.textContent = "Удалить из корзины";
                    toCartBtn.dataset.action = "remove";
                } else {
                    toCartBtn.textContent = "Добавить в корзину";
                    toCartBtn.dataset.action = "add";
                }
            }

            fetch(`{% url "cart" %}?product_id=${productId}`)
                .then(response => response.json())
                .then(data => {
                    setButtonState(data.in_cart);
                })
                .catch(err => console.error('Ошибка проверки корзины:', err));

            toCartBtn.onclick = function (event) {
                event.preventDefault();
                const action = toCartBtn.dataset.action;

                if (action === 'add') {
                    const quantity = parseInt(counter.innerHTML) || 0;
                    if (quantity < 1) {
                        alert('Укажите количество больше 0');
                        return;
                    }
                    fetch(`{% url "cart" %}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken
                        },
                        body: JSON.stringify({
                            product_id: productId,
                            quantity: quantity
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            setButtonState(true);
                        }
                    })
                    .catch(err => console.error('Ошибка добавления:', err));

                } else if (action === 'remove') {
                    const deleteUrl = "{% url 'cart-delete' product_id=0 %}".replace('0', productId);
                    fetch(deleteUrl, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            setButtonState(false);
                            counter.innerHTML = "0";
                        } else {
                            return response.json().then(err => console.error('Ошибка:', err));
                        }
                    })
                    .catch(err => console.error('Ошибка удаления:', err));
                }
            }
        });
    </script>
    <div class="product-container">
        <div class="image-container">
            {% if product.productimage_set.all %}
                {% for image in product.productimage_set.all %}
                    <img src="{{ image.image.url }}" alt="">
                {% endfor %}
            {% else %}
                <img src="{{ product.image.url }}" alt="{{ product.title }}">
            {% endif %}
        </div>
        <div class="info-container">
            <p>Название: {{ product.title }}</p>
            <p>Цена: {{ product.price }}</p>
            <p>Описание: {{ product.description }}</p>
        </div>
        <div class="counter-container">
            <button id="decrease">-</button>
            <b id="counter">0</b>
            <button id="increase">+</button>
        </div>
    </div>
    <a href="#" id="add-to-cart">Добавить в корзину</a>
</body>
</html>
